name: trace

services:
  postgres:
    image: postgres:17
    env_file:
      - ../backend/.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
